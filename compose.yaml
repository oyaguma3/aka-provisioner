# aka-provisioner（管理面のノード）。aka-provisioner・専用の Valkey・管理面の Fluent Bit を動かす（設計概要 §12）。
# 管理面の aka-ossbss（と段階 4 の radsec-ca）のログも、この Fluent Bit に送る（それぞれの compose.fluent-bit.yaml を重ねる）。

x-logging: &fluent-bit-logging
  driver: fluentd
  options: &fluent-bit-options
    fluentd-address: localhost:${PROVISIONER_FLUENT_BIT_PORT:-24224}
    fluentd-async: "true"
    fluentd-buffer-limit: "1048576"

services:
  aka-provisioner:
    build:
      context: .
      args:
        VERSION: ${PROVISIONER_VERSION:-dev}
    image: aka-provisioner:${PROVISIONER_VERSION:-dev}
    restart: unless-stopped
    # 停止の合図から、API のサーバーを閉じ終えるまで最大 10 秒かかる。
    stop_grace_period: 15s
    depends_on:
      valkey:
        condition: service_healthy
    # ループバックの healthcheck の口（専用の Valkey に届くか）を確かめる（distroless のため curl はない）。
    healthcheck:
      test: ["CMD", "/aka-provisioner", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      PROVISIONER_ADDR: ":9446"
      PROVISIONER_TLS_CERT: ${PROVISIONER_TLS_CERT:-/data/tls/cert.pem}
      PROVISIONER_TLS_KEY: ${PROVISIONER_TLS_KEY:-/data/tls/key.pem}
      PROVISIONER_TLS_HOSTS: ${PROVISIONER_TLS_HOSTS:-localhost,127.0.0.1,aka-provisioner}
      PROVISIONER_ADMIN_CLIENTS_FILE: /run/secrets/admin-clients
      PROVISIONER_DOWNSTREAMS_FILE: /etc/aka-provisioner/downstreams/downstreams.json
      PROVISIONER_DOWNSTREAM_TIMEOUT: ${PROVISIONER_DOWNSTREAM_TIMEOUT:-5s}
      PROVISIONER_VALKEY_ADDR: valkey:6379
      PROVISIONER_VALKEY_PASSWORD: ${PROVISIONER_VALKEY_PASSWORD:?.env に PROVISIONER_VALKEY_PASSWORD を設定してください}
      PROVISIONER_AUDIT_MAX: ${PROVISIONER_AUDIT_MAX:-100000}
      PROVISIONER_AUDIT_DIR: /data/audit
      PROVISIONER_AUDIT_RETENTION_DAYS: ${PROVISIONER_AUDIT_RETENTION_DAYS:-14}
      PROVISIONER_LOG_LEVEL: ${PROVISIONER_LOG_LEVEL:-info}
      TZ: Asia/Tokyo
    secrets:
      - admin-clients
    volumes:
      # 自動生成したサーバー証明書を保存する。
      - provisioner-data:/data
      # 下流の登録簿 downstreams.json と、provisioner のクライアント証明書と鍵、下流のサーバー証明書（設計概要 §8.1）。
      # ディレクトリごとマウントする（SIGHUP で読み直すとき、mv で置き換えたファイルも見えるように）。
      # コンテナは UID 65532 で動くので、ファイルはこの UID で読めるようにする。
      - ./downstreams:/etc/aka-provisioner/downstreams:ro
      # 監査ログの日ごとのファイル（監視用の PC が取りに行く）。
      - ./audit:/data/audit
      # 持ち込みのサーバー証明書を置く場合（PROVISIONER_TLS_CERT・_KEY に /certs/... を指定する）。
      - ./certs:/certs:ro
    ports:
      # Docker が公開したポートは ufw の規則を通らない。公開範囲はここのバインド先（サービス用の WireGuard のアドレス）で制御する。
      - "${PROVISIONER_PUBLISH:-127.0.0.1:9446}:9446"
    networks:
      - default
      # 同一ホストの管理クライアント（aka-ossbss）は、この共有ネットワークに参加して https://aka-provisioner:9446 で接続する。
      - shared
    logging:
      <<: *fluent-bit-logging
      options:
        <<: *fluent-bit-options
        tag: app.provisioner

  valkey:
    image: valkey/valkey:9.1.2
    restart: unless-stopped
    # Idempotency-Key の記録と監査ログを保存する（provisioner 専用。下流の Valkey とは別）。
    # Idempotency-Key の記録を失わないよう、AOF は書き込みごとに同期する。
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "always", "--requirepass", "${PROVISIONER_VALKEY_PASSWORD}"]
    environment:
      VALKEY_PASSWORD: ${PROVISIONER_VALKEY_PASSWORD:?.env に PROVISIONER_VALKEY_PASSWORD を設定してください}
    volumes:
      - valkey-data:/data
    # 共有ネットワークには参加させない。
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      <<: *fluent-bit-logging
      options:
        <<: *fluent-bit-options
        tag: app.provisioner-valkey

  # 管理面の Fluent Bit。Docker のログドライバー（fluentd）からログを受け、アプリごとのファイルに書く
  # （設計概要 §10。aka-radius の Fluent Bit と同じ作り）。ファイルはホストの logrotate で日ごとに圧縮し、2 週間持つ。
  fluent-bit:
    image: fluent/fluent-bit:4.2.8
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]
    restart: unless-stopped
    # Docker のログドライバーはホストの localhost に接続する。外部には公開しない。
    # 同じホストで aka-radius の Fluent Bit（24224）と並べて試すときは、PROVISIONER_FLUENT_BIT_PORT を変える。
    ports:
      - "127.0.0.1:${PROVISIONER_FLUENT_BIT_PORT:-24224}:24224"
    volumes:
      - ./configs/fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./logs_on_host:/output_logs
    environment:
      TZ: Asia/Tokyo

secrets:
  # 管理クライアント（aka-ossbss）のピンのファイル（1 行に「識別名=フィンガープリント」）。SIGHUP で読み直す。
  # ファイルごとのマウントなので、その場で書き換える（mv で置き換えたら --force-recreate で作り直す）。
  admin-clients:
    file: ./secrets/admin-clients

networks:
  default:
  shared:
    name: ${PROVISIONER_SHARED_NETWORK:-aka-provisioner}

volumes:
  provisioner-data:
  valkey-data:

        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/DownstreamError'
        '503':
          $ref: '#/components/responses/DownstreamUnavailable'
    post:
      tags: [vecgen]
      summary: 下流の POST /subscribers を中継する（登録。監査ログ vecgen.subscriber.create）
      operationId: vecgenPostSubscribers
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Relayed'
      responses:
        default:
          $ref: '#/components/responses/Relayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyMismatch'
        '502':
          $ref: '#/components/responses/DownstreamError'
        '503':
          $ref: '#/components/responses/DownstreamUnavailable'
  /vecgen/subscribers/batch-get:

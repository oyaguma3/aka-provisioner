openapi: 3.0.3
info:
  title: aka-provisioner API
  version: 2.0.0
  description: |
    管理面の aka-ossbss から、下流（aka-vecgen・aka-radius の管理API 2.0.0）への変更の経路を 1 つにまとめる中継の API。
    設計は `docs/design-overview.md`（§6〜§10、§17 の「段階 3-1 で決めたこと」）を参照。
    0.3.0（`/admin/v1`。加入者の統合操作と補償、PLMN マップ、操作の記録）の後継で、互換は持たない。

    中継:
    - `/admin/v2/<下流>/<下流のパス>` を、下流の `/admin/v2/<下流のパス>` に中継する（下流は `vecgen` と `radius`。
      radsec-ca とエッジは段階 4-2 で足す）。許すのは下の paths に挙げた口だけで、それ以外は 404（`ROUTE_NOT_ALLOWED`）。
      aka-vecgen の鍵の読み出し（`GET /subscribers/{imsi}/keys`）と、RADIUS クライアントの書き込みは通さない。
    - 要求の本文とクエリは解釈せずにそのまま送り、下流の応答（エラーを含む）をそのまま返す。項目は下流の OpenAPI
      （aka-vecgen・aka-radius の `docs/openapi/admin-api.yaml`）を正とし、ここには写さない。
    - 下流の ProblemDetails には `downstream`（`vecgen` / `radius`）を足す。`Location` は aka-provisioner のパスに書き換える。
    - 下流につながらない・時間内に応答がないときは 503（`DOWNSTREAM_UNAVAILABLE`）、下流が ProblemDetails でない誤りを
      返したときは 502（`DOWNSTREAM_ERROR`）。どちらも `downstream` つき。
    - パスの値は形を確かめる（`imsi` は 5〜15 桁の数字、`clientId` は 1 以上の整数）。違えば 400（`MANDATORY_IE_INCORRECT`）。
    - 要求の本文は 1 MiB まで。

    認証:
    - mTLS 必須。管理クライアントのピンのファイル（`PROVISIONER_ADMIN_CLIENTS_FILE`。1 行に「識別名=SHA-256 フィンガープリント」）
      にある証明書だけを受け付け、それ以外は TLS ハンドシェイクで断る（ログの `ADMIN_CLIENT_REJECTED`）。SIGHUP で読み直す。
    - 管理クライアントは全権として扱う。利用者や権限の概念はこの API にはない（aka-ossbss が持つ）。

    操作者・トレース:
    - `X-Operator-Id`（任意）を監査ログに残し、そのまま下流に渡す。
    - `X-Trace-ID`（任意）を受け取り、なければ採番する。同じ値を下流に渡し、ログと監査ログに残し、応答の `X-Trace-ID` で返す。

    再送（Idempotency-Key）:
    - 下流を書き換える口（下の paths で `Idempotency-Key` を求めるもの）では必須。なければ 400（`MANDATORY_IE_MISSING`）。
      一括取得（`POST /subscribers/batch-get`）は何も変えないので求めない。
    - 同じ管理クライアントから同じキーで届いた要求には、24 時間のあいだ最初の応答をそのまま返し（`Idempotent-Replayed: true`）、
      下流は呼ばない。最初の要求が処理中なら 409（`OPERATION_IN_PROGRESS`）、同じキーで内容（メソッド・パス・クエリ・本文）が
      違えば 422（`IDEMPOTENCY_KEY_MISMATCH`）。5xx の応答は覚えない（同じキーでやり直せる）。
    - aka-vecgen・aka-radius にはキーを渡さない（再送の判定は aka-provisioner が受け持つ）。

    監査ログ:
    - 下流を書き換える中継が成功（2xx）したときに残す。`action` は `<下流>.<口>`（例 `vecgen.subscriber.create`）、
      `target` は IMSI、`detail` は下流の名前と本文の項目の名前だけ（値は残さない）。再送への応答では残さない。
      Valkey の Stream と日ごとの JSONL のファイルに書く。
servers:
  - url: https://{host}:{port}/admin/v2
    variables:
      host:
        default: localhost
      port:
        default: '9446'
tags:
  - name: provisioner
    description: aka-provisioner 自身の口
  - name: vecgen
    description: aka-vecgen の管理API の中継
  - name: radius
    description: aka-radius の管理API の中継
paths:
  /status:
    get:
      tags: [provisioner]
      summary: aka-provisioner と下流の状態
      operationId: getStatus
      description: |
        下流の状態は 30 秒ごとに集めたものを返し、要求のたびには下流を呼ばない。`downstreams[].status` は下流の
        `/status` の本文を解釈せずにそのまま入れる。Valkey に届かなくても 200 で、`valkey` に誤りを出す。
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /audit-logs:
    get:
      tags: [provisioner]
      summary: aka-provisioner の監査ログ（新しい順）
      operationId: listAuditLogs
      parameters:
        - name: before
          in: query
          description: 前の応答の `nextBefore`。このエントリより古いものを返す。
          schema:
            type: string
            pattern: '^[0-9]{1,20}-[0-9]{1,20}$'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 監査ログ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /vecgen/status:
    get:
      tags: [vecgen]
      summary: 下流の GET /status を中継する
      operationId: vecgenGetStatus
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        default:
          $ref: '#/components/responses/Relayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/DownstreamError'
        '503':
          $ref: '#/components/responses/DownstreamUnavailable'
  /vecgen/subscribers:
    get:
      tags: [vecgen]
      summary: 下流の GET /subscribers を中継する
      operationId: vecgenGetSubscribers
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/TraceId'
      responses:

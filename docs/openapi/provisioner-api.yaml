          $ref: '#/components/responses/Relayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/DownstreamError'
        '503':
          $ref: '#/components/responses/DownstreamUnavailable'
  /radius/sources:
    get:
      tags: [radius]
      summary: 下流の GET /sources を中継する
      operationId: radiusGetSources
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        default:
          $ref: '#/components/responses/Relayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/DownstreamError'
        '503':
          $ref: '#/components/responses/DownstreamUnavailable'
  /radius/audit-logs:
    get:
      tags: [radius]
      summary: 下流の GET /audit-logs を中継する
      operationId: radiusGetAuditLogs
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        default:
          $ref: '#/components/responses/Relayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/DownstreamError'
        '503':
          $ref: '#/components/responses/DownstreamUnavailable'
components:
  parameters:
    Imsi:
      name: imsi
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{5,15}$'
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OperatorId:
      name: X-Operator-Id
      in: header
      required: false
      description: 操作者 ID。監査ログに残し、下流に渡す。
      schema:
        type: string
        pattern: '^[A-Za-z0-9._@-]{1,64}$'
    TraceId:
      name: X-Trace-ID
      in: header
      required: false
      description: トレースID。形が違えば採番する。下流に渡し、応答の X-Trace-ID で返す。
      schema:
        type: string
        pattern: '^[\x21-\x7E]{1,64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 再送の判定のキー（印字可能 ASCII 1〜128 文字）。下流を書き換える口では必須。
      schema:
        type: string
        pattern: '^[\x21-\x7E]{1,128}$'
  requestBodies:
    Relayed:
      description: 下流の要求の本文（解釈せずにそのまま送る。項目は下流の OpenAPI）。
      required: true
      content:
        application/json:
          schema:
            type: object
  responses:
    Relayed:
      description: 下流の応答をそのまま返す（ProblemDetails には `downstream` を足し、`Location` は aka-provisioner のパスに書き換える）。
      headers:
        Idempotent-Replayed:
          description: 同じ Idempotency-Key の最初の応答を返したとき `true`。
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: 要求の形の誤り（`INVALID_MSG_FORMAT`・`INVALID_QUERY_PARAM`・`MANDATORY_IE_MISSING`・`MANDATORY_IE_INCORRECT`・`OPTIONAL_IE_INCORRECT`）。下流が返した 400 もこの形。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: 同じ Idempotency-Key の要求が処理中（`OPERATION_IN_PROGRESS`）。下流が返した 409 もこの形。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    IdempotencyKeyMismatch:
      description: 同じ Idempotency-Key で内容が違う（`IDEMPOTENCY_KEY_MISMATCH`）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DownstreamError:
      description: 下流が ProblemDetails でない誤りを返した（`DOWNSTREAM_ERROR`。`downstreamStatus` に下流の状態コード）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DownstreamUnavailable:
      description: 下流につながらない・時間内に応答がない（`DOWNSTREAM_UNAVAILABLE`）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        cause:
          type: string
          description: |
            aka-provisioner の誤りは INVALID_MSG_FORMAT、INVALID_QUERY_PARAM、MANDATORY_IE_MISSING、MANDATORY_IE_INCORRECT、
            OPTIONAL_IE_INCORRECT、ROUTE_NOT_ALLOWED、OPERATION_IN_PROGRESS、IDEMPOTENCY_KEY_MISMATCH、DOWNSTREAM_ERROR、
            DOWNSTREAM_UNAVAILABLE、SYSTEM_FAILURE。下流の誤りは下流の cause のまま。
        invalidParams:
          type: array
          items:
            type: object
            properties:
              param:
                type: string
              reason:
                type: string
        downstream:
          type: string
          enum: [vecgen, radius]
        downstreamStatus:
          type: integer
    Certificate:
      type: object
      properties:
        subject:
          type: string
        notAfter:
          type: string
          format: date-time
        fingerprint:
          type: string
          description: SHA-256（16進小文字）
    Status:
      type: object
      required: [version, startedAt, valkey, adminClients, adminClientsLoadedAt, downstreamsLoadedAt, clientCertificate, serverCertificate, downstreams]
      properties:
        version:
          type: string
        startedAt:
          type: string
          format: date-time
        valkey:
          type: object
          properties:
            reachable:
              type: boolean
            error:
              type: string
        adminClients:
          type: array
          items:
            type: string
          description: 管理クライアントの識別名
        adminClientsLoadedAt:
          type: string
          format: date-time
        downstreamsLoadedAt:
          type: string
          format: date-time
        clientCertificate:
          $ref: '#/components/schemas/Certificate'
        serverCertificate:
          $ref: '#/components/schemas/Certificate'
        downstreams:
          type: array
          items:
            type: object
            required: [name, url, serverCertificate, reachable]
            properties:
              name:
                type: string
                enum: [vecgen, radius]
              url:
                type: string
              serverCertificate:
                $ref: '#/components/schemas/Certificate'
              reachable:
                type: boolean
              checkedAt:
                type: string
                format: date-time
              error:
                type: string
              hint:
                type: string
              status:
                type: object
                description: 下流の /status の本文（解釈せずにそのまま）
    AuditLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, time, operator, mgmtClient, action, target, traceId]
            properties:
              id:
                type: string
              time:
                type: string
                format: date-time
              operator:
                type: string
              mgmtClient:
                type: string
              action:
                type: string
                example: vecgen.subscriber.create
              target:
                type: string
              detail:
                type: object
                example:
                  downstream: vecgen
                  fields: [imsi, ki, opc, state]
              traceId:
                type: string
        nextBefore:
          type: string

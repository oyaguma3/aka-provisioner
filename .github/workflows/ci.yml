# テスト、イメージのビルドと compose の設定の確認、下流（aka-vecgen・aka-radius の管理API 2.0.0）との契約の試験を行う。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同じブランチで新しく push したら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # internal/store の結合テストに使う。論理データベース 1 番を空にして使う。
      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 整形の確認
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: テスト（Valkey の結合テストを含む）
        env:
          PROVISIONER_TEST_VALKEY_ADDR: localhost:6379
        run: go test -race -count=1 ./...
      - name: Valkey の結合テストが実行されたことの確認
        env:
          PROVISIONER_TEST_VALKEY_ADDR: localhost:6379
        run: |
          set -o pipefail
          # 接続先がなければ結合テストはスキップされ、テスト自体は成功してしまうので、別に確かめる。
          go test -count=1 -v ./internal/store/ | tee store.log
          if grep -q -- '--- SKIP' store.log; then
            echo "Valkey の結合テストがスキップされました"
            exit 1
          fi

  docker:
    name: イメージと compose の設定
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: イメージのビルド
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" -t aka-provisioner:ci .
      - name: compose の設定（下流が別ホストと同一ホスト）
        run: |
          cp .env.example .env
          sed -i 's|^PROVISIONER_VALKEY_PASSWORD=.*|PROVISIONER_VALKEY_PASSWORD=ci|' .env
          touch secrets/admin-clients
          docker compose config -q
          docker compose config --services | sort | tr '\n' ' ' | tee services.txt
          test "$(cat services.txt)" = "aka-provisioner fluent-bit valkey "
          COMPOSE_FILE=compose.yaml:compose.aka-radius-admin.yaml docker compose config -q
          COMPOSE_FILE=compose.yaml:compose.aka-av.yaml docker compose config -q
          COMPOSE_FILE=compose.yaml:compose.aka-radius-admin.yaml:compose.aka-av.yaml docker compose config -q
      - name: 起動と healthcheck（下流なし。登録簿は届かない宛先）
        run: |
          # 下流に届かなくても起動し、healthcheck（専用の Valkey に届くか）が通ることを確かめる。
          go_image=aka-provisioner:ci
          docker run --rm --entrypoint /aka-provisioner "$go_image" gen-client-cert -name provisioner-ci > downstreams/client.pem 2> gen.txt
          cp downstreams/client.pem downstreams/vecgen-admin.pem
          cp downstreams/client.pem downstreams/radius-admin.pem
          sed -e 's#https://10.20.0.2:9443#https://127.0.0.1:1#' -e 's#https://10.20.0.2:9444#https://127.0.0.1:2#' \
            downstreams/downstreams.example.json > downstreams/downstreams.json
          docker run --rm --entrypoint /aka-provisioner -u 0 "$go_image" gen-client-cert -name ossbss-ci 2> ossbss.txt > /dev/null
          grep -E '^ossbss-ci=' ossbss.txt > secrets/admin-clients
          sudo chown -R 65532:65532 downstreams secrets/admin-clients audit
          sudo chmod 600 downstreams/client.pem secrets/admin-clients
          echo "PROVISIONER_VERSION=ci" >> .env
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q aka-provisioner)")" = healthy ] && break
            sleep 2
          done
          docker compose ps
          test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q aka-provisioner)")" = healthy
          # ログは Fluent Bit を通してファイルに書かれる。
          sleep 3
          sudo grep -q '"event_id":"DOWNSTREAMS_LOADED"' logs_on_host/provisioner.log
          sudo grep -q '"event_id":"DOWNSTREAM_UNREACHABLE"' logs_on_host/provisioner.log
      - name: compose のログ（失敗時）
        if: failure()
        run: docker compose logs --no-color || true
      - name: 片付け
        if: always()
        run: docker compose down -v || true

  guide:
    name: 運用ガイドの手順の通し確認
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: 準備（ピン、クライアント証明書、登録簿）
        run: |
          cp .env.example .env
          sed -i 's|^PROVISIONER_VALKEY_PASSWORD=.*|PROVISIONER_VALKEY_PASSWORD=ci-valkey-password|' .env
          # ピンのファイルはコンテナを動かす前に作る（ないと Docker が同じ名前のディレクトリを作る）
          mkdir -p secrets audit certs backups
          touch secrets/admin-clients
          docker compose build -q
          docker compose run --rm --no-deps -T aka-provisioner gen-client-cert -name provisioner > downstreams/client.pem 2> gen.txt
          grep -E '^provisioner=[0-9a-f]{64}$' gen.txt
          # 下流は立てない（届かない宛先。下流とのやり取りは「下流との契約の試験」で確かめる）
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=downstream \
            -keyout "$RUNNER_TEMP/ds.key" -out downstreams/vecgen-admin.pem 2>/dev/null
          cp downstreams/vecgen-admin.pem downstreams/radius-admin.pem
          sed -e 's#https://10.20.0.2:9443#https://127.0.0.1:1#' -e 's#https://10.20.0.2:9444#https://127.0.0.1:2#' \
            downstreams/downstreams.example.json > downstreams/downstreams.json
          # 管理クライアント（aka-ossbss の代わり）の証明書。ピンは openssl の出力の形でも書ける
          for n in ossbss ossbss-new; do
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj "/CN=$n" \
              -addext extendedKeyUsage=clientAuth -keyout "$RUNNER_TEMP/$n.key" -out "$RUNNER_TEMP/$n.pem" 2>/dev/null
          done
          echo "ossbss=$(openssl x509 -in "$RUNNER_TEMP/ossbss.pem" -noout -fingerprint -sha256 | cut -d= -f2)" > secrets/admin-clients
          sudo chown -R 65532:65532 downstreams secrets/admin-clients audit
          sudo chmod 600 downstreams/client.pem secrets/admin-clients
      - name: 起動と mTLS の /status
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
          docker compose exec -T aka-provisioner /aka-provisioner healthcheck
          docker compose exec -T aka-provisioner /aka-provisioner server-cert > "$RUNNER_TEMP/server.pem"
          A="curl -sS --fail-with-body --cacert $RUNNER_TEMP/server.pem --cert $RUNNER_TEMP/ossbss.pem --key $RUNNER_TEMP/ossbss.key"
          $A https://localhost:9446/admin/v2/status | jq -e '.adminClients == ["ossbss"] and .valkey.reachable and (.downstreams | length == 2)'
          # 下流に届かなければ check-downstream は失敗し、原因の見当を出す
          if docker compose exec -T aka-provisioner /aka-provisioner check-downstream > check.txt 2>&1; then
            cat check.txt
            echo "届かない下流で check-downstream が成功しました"
            exit 1
          fi
          grep -q '接続できません' check.txt
          # 下流を書き換える要求は Idempotency-Key が必須、許していない口は通さない
          test "$($A -o /dev/null -w '%{http_code}' -X POST https://localhost:9446/admin/v2/vecgen/subscribers -d '{}' || true)" = 400
          test "$($A -o /dev/null -w '%{http_code}' https://localhost:9446/admin/v2/vecgen/subscribers/440100123456789/keys || true)" = 404
      - name: 管理クライアントのピンの入れ替え（運用ガイド 4.2）
        run: |
          OLD="curl -sS --fail-with-body --cacert $RUNNER_TEMP/server.pem --cert $RUNNER_TEMP/ossbss.pem --key $RUNNER_TEMP/ossbss.key"
          NEW="curl -sS --fail-with-body --cacert $RUNNER_TEMP/server.pem --cert $RUNNER_TEMP/ossbss-new.pem --key $RUNNER_TEMP/ossbss-new.key"
          old_fp=$(openssl x509 -in "$RUNNER_TEMP/ossbss.pem" -noout -fingerprint -sha256 | cut -d= -f2)
          new_fp=$(openssl x509 -in "$RUNNER_TEMP/ossbss-new.pem" -noout -fingerprint -sha256 | cut -d= -f2)
          # 登録していない証明書は TLS のハンドシェイクで断る
          if $NEW https://localhost:9446/admin/v2/status; then
            echo "登録していない管理クライアントが接続できてしまいました"
            exit 1
          fi
          echo "ossbss=$new_fp" | sudo tee -a secrets/admin-clients > /dev/null
          docker compose kill -s HUP aka-provisioner
          sleep 1
          $OLD https://localhost:9446/admin/v2/status > /dev/null
          $NEW https://localhost:9446/admin/v2/status > /dev/null
          # 古い行を消す。ファイルごとマウントしているので、その場で書き換える
          sudo sh -c "grep -v '$old_fp' secrets/admin-clients > /tmp/admin-clients.new && cat /tmp/admin-clients.new > secrets/admin-clients && rm /tmp/admin-clients.new"
          docker compose kill -s HUP aka-provisioner
          sleep 1
          $NEW https://localhost:9446/admin/v2/status > /dev/null
          if $OLD https://localhost:9446/admin/v2/status; then
            echo "消したピンの管理クライアントが接続できてしまいました"
            exit 1
          fi
      - name: Valkey のバックアップと戻し（運用ガイド 8 章）
        run: |
          A="curl -sS --cacert $RUNNER_TEMP/server.pem --cert $RUNNER_TEMP/ossbss-new.pem --key $RUNNER_TEMP/ossbss-new.key"
          v() { docker compose exec -T valkey sh -c 'valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning "$@"' valkey-cli "$@"; }
          v SET ci:marker before
          scripts/backup-valkey.sh backups/valkey.rdb
          # 写しの後の変更は、戻すと消える
          v SET ci:marker after
          scripts/restore-valkey.sh backups/valkey.rdb
          docker compose up -d --wait --wait-timeout 120
          test "$(v GET ci:marker)" = before
          $A --fail-with-body --retry 10 --retry-delay 2 --retry-all-errors https://localhost:9446/admin/v2/status | jq -e '.valkey.reachable'
      - name: Fluent Bit のファイル
        run: |
          sleep 3
          sudo grep -q '"event_id":"ADMIN_REQUEST"' logs_on_host/provisioner.log
          sudo grep -q '"event_id":"ADMIN_CLIENTS_RELOADED"' logs_on_host/provisioner.log
          sudo grep -q '"event_id":"ADMIN_CLIENT_REJECTED"' logs_on_host/provisioner.log
      - name: compose のログ（失敗時）
        if: failure()
        run: docker compose logs --no-color || true
      - name: 片付け
        if: always()
        run: docker compose down -v || true

  contract:
    name: 下流との契約の試験
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 契約の試験の相手にする下流のコミット。aka-mvpset の versions.env の VECGEN_REF・RADIUS_REF と一致させる
      # （下流の API を変えたら、その main に入った後のコミットに更新する）。
      VECGEN_REF: 2d4837939660fbadcec67b27b4ac333f96a77374
      RADIUS_REF: 00506874286cca3d454e3ba64365c6e7f0b10fe6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/aka-vecgen
          ref: ${{ env.VECGEN_REF }}
          path: aka-vecgen
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/aka-radius
          ref: ${{ env.RADIUS_REF }}
          path: aka-radius
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 下流と aka-provisioner のビルド
        run: |
          git -C aka-vecgen log -1 --format='aka-vecgen: %h %s'
          git -C aka-radius log -1 --format='aka-radius: %h %s'
          mkdir -p "$RUNNER_TEMP/bin"
          (cd aka-vecgen && go build -o "$RUNNER_TEMP/bin/aka-vecgen" ./cmd/aka-vecgen)
          (cd aka-radius && go build -o "$RUNNER_TEMP/bin/aka-radius" ./cmd/aka-radius)
          go build -o "$RUNNER_TEMP/bin/aka-provisioner" ./cmd/aka-provisioner
      - name: 口の一覧と下流の OpenAPI の突き合わせ
        env:
          PROVISIONER_TEST_VECGEN_OPENAPI: ${{ github.workspace }}/aka-vecgen/docs/openapi/admin-api.yaml
          PROVISIONER_TEST_RADIUS_OPENAPI: ${{ github.workspace }}/aka-radius/docs/openapi/admin-api.yaml
        run: |
          set -o pipefail
          go test -count=1 -run TestAllowlistMatchesOpenAPI -v ./internal/api/ | tee openapi.log
          # 下流の OpenAPI が渡らないと試験は飛ばされ、成功してしまうので、別に確かめる。
          if grep -q -- '--- SKIP' openapi.log; then
            echo "突き合わせの試験が飛ばされました"
            exit 1
          fi
      - name: 下流と aka-provisioner の起動
        run: scripts/contract.sh up "$RUNNER_TEMP/bin" "$RUNNER_TEMP/work"
      - name: 契約の試験
        run: |
          set -o pipefail
          . "$RUNNER_TEMP/work/contract.env"
          go test -count=1 -race -v ./internal/contract/ | tee contract.log
          if grep -q -- '--- SKIP' contract.log; then
            echo "契約の試験が飛ばされました"
            exit 1
          fi
      - name: 下流と aka-provisioner のログ（失敗時）
        if: failure()
        run: |
          for f in aka-vecgen aka-radius aka-provisioner; do
            echo "---- $f ----"; cat "$RUNNER_TEMP/work/$f.log" || true
          done
      - name: 片付け
        if: always()
        run: scripts/contract.sh down "$RUNNER_TEMP/work" || true
